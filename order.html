<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Order Fruits - Farm2Bite</title>

    <!-- Bootstrap CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- Bootstrap JS (For Navbar Toggle) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js" defer></script>
</head>
<body>

    <!-- Bootstrap Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="home.html"><img src="./icon.webp" alt="Fresh Fruits Logo" width="70" height="70"></a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="home.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="fruit.html">Fruits</a></li>
                    <li class="nav-item"><a class="nav-link active" href="order.html">Order</a></li>
                    <li class="nav-item"><a class="nav-link" href="about.html">About Us</a></li>
                    <li class="nav-item"><a class="nav-link" href="contact.html">Contact Us</a></li>
                    <li class="nav-item">
                        <a class="nav-link btn px-3" href="Login Register Form.html" target="_blank">Register / Login</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Order Page Content -->
    <div class="order-container mt-5" >
        <h1 class="text-center fw-bold">Order Your Fresh Harvest</h1>
        <h2 class="text-center lead">Crisp, farm-fresh organic produce ready for quick home delivery.</h2>

        <!-- Order Form -->
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow-lg p-4">
                    <h3 class="text-center mb-4">Express Checkout</h3>
                    <form onsubmit="event.preventDefault(); storeOrder();">
                        
                        <div class="mb-3">
                            <label for="name" class="form-label">Full Name:</label>
                            <input type="text" id="name" name="name" class="form-control" placeholder="Enter your full name" required>
                        </div>

                        <div class="mb-3">
                            <label for="email" class="form-label">Email Address:</label>
                            <input type="email" id="email" name="email" class="form-control" placeholder="Enter your email" required>
                        </div>

                        <div class="mb-3">
                            <label for="phone" class="form-label">Phone Number:</label>
                            <input type="tel" id="phone" name="phone" class="form-control" placeholder="10-digit mobile number" required>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="fruit" class="form-label">Select Fruit:</label>
                                <select id="fruit" name="fruit" class="form-select" onchange="calculateOrderPreview()" required>
                                    <option value="apple" data-price="140">Apple (₹140/kg)</option>
                                    <option value="banana" data-price="40">Banana (₹40/kg)</option>
                                    <option value="mango" data-price="160">Mango (₹160/kg)</option>
                                    <option value="grapes" data-price="100">Grapes (₹100/kg)</option>
                                    <option value="orange" data-price="120">Orange (₹120/kg)</option>
                                    <option value="strawberry" data-price="200">Strawberry (₹200/kg)</option>
                                    <option value="guava" data-price="90">Guava (₹90/kg)</option>
                                    <option value="papaya" data-price="140">Papaya (₹140/kg)</option>
                                    <option value="cherry" data-price="260">Cherry (₹260/kg)</option>
                                </select>
                            </div>

                            <div class="col-md-6 mb-3">
                                <label for="quantity" class="form-label">Quantity:</label>
                                <select id="quantity" name="quantity" class="form-control" onchange="calculateOrderPreview()" required>
                                    <option value="0.25">250g</option>
                                    <option value="0.5">500g</option>
                                    <option value="1" selected>1 kg</option>
                                    <option value="2">2 kg</option>
                                    <option value="5">5 kg</option>
                                </select>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="date" class="form-label">Delivery Date:</label>
                                <input type="date" id="date" name="date" class="form-control" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="timeslot" class="form-label">Preferred Time Slot:</label>
                                <select id="timeslot" class="form-select">
                                    <option value="morning">Morning (7:00 AM - 10:30 AM)</option>
                                    <option value="afternoon">Afternoon (1:00 PM - 4:00 PM)</option>
                                    <option value="evening">Evening (6:00 PM - 9:00 PM)</option>
                                </select>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="address" class="form-label">Delivery Address / Landmark:</label>
                            <textarea id="address" name="address" class="form-control" placeholder="Flat / House No, Street, City, Pincode" required></textarea>
                        </div>

                        <!-- Live Price Preview Card -->
                        <div class="alert alert-warning text-center fw-bold fs-5 my-3">
                            Estimated Total: <span id="previewPrice" class="text-danger">₹140</span>
                        </div>

                        <div class="text-center">
                            <button type="submit" class="btn btn-lg w-100">Proceed to Payment</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
